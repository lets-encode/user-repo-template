name: Campaign automation

# The ONE task-agnostic caller — this repo carries no task logic. It forwards
# the triggering event to the central automation code named by the `automation:`
# block in config.yaml (read from THIS repo's base tree, never from a fork) and
# runs it. Claims, submissions and the stale-lock reaper are all routed there.
#
# Trust boundary: pull_request_target runs in THIS repo's context with a write
# token. Only the pinned central code is checked out; the automation pointer is
# read from THIS repo's base tree via the API, and the fork's PR is only ever
# read as data, never executed.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - tracking/**
      - sources/**
  schedule:
    - cron: '0 * * * *' # fallback cleanup; claims also reap expired locks lazily
  workflow_dispatch: {} # manual reaper run (e.g. from the campaign console)

# Serialise runs so two events can't be applied concurrently (belt-and-braces
# alongside the coordinator's optimistic-concurrency retry).
concurrency:
  group: campaign-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      # Only encoding submissions use xmllint, and only pull_request_target
      # events can carry one. The binary is cached keyed on the runner image
      # (ImageOS/ImageVersion), so most runs skip apt entirely; on a miss the
      # install is started here and reaped just before the coordinator runs, so
      # the dpkg work overlaps the checkout/setup steps below.
      - name: Compute the xmllint cache key (MEI machine-check)
        if: github.event_name == 'pull_request_target'
        id: xmllint-key
        run: echo "key=xmllint-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore the cached xmllint binary (MEI machine-check)
        if: github.event_name == 'pull_request_target'
        id: xmllint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/xmllint-bin
          key: ${{ steps.xmllint-key.outputs.key }}

      - name: Start installing xmllint in the background (MEI machine-check)
        if: github.event_name == 'pull_request_target' && steps.xmllint-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils \
            > /tmp/xmllint-install.log 2>&1 &
          echo $! > /tmp/xmllint-install.pid

      # The central pointer comes from config.yaml on the base ref — a fork PR
      # cannot redirect where central lives (GITHUB_SHA is the base branch head
      # for pull_request_target). One API read; nothing else in the campaign
      # repo is needed on disk, so there is no base checkout. `path:` also
      # appears under `sources:`, so the reads are scoped to the `automation:`
      # block. config.yaml is committed by campaign initialisation; before that
      # (e.g. a scheduled run on a freshly generated repo) it is missing (404),
      # all outputs are empty and the remaining steps no-op. Any other API
      # failure fails the run rather than silently doing nothing.
      - name: Read the central automation pointer from config.yaml
        id: cfg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/config.yaml?ref=$GITHUB_SHA" \
               -H "Accept: application/vnd.github.raw" > config.yaml 2> gh-error.txt; then
            cat gh-error.txt >&2
            grep -q 'HTTP 404' gh-error.txt || exit 1
            : > config.yaml
          fi
          read_automation() {
            awk -v key="$1" '
              /^automation:/ { in_block = 1; next }
              /^[^[:space:]]/ { in_block = 0 }
              in_block && $1 == key ":" { gsub(/"/, "", $2); print $2; exit }
            ' config.yaml 2>/dev/null || true
          }
          echo "repo=$(read_automation central_repository)" >> "$GITHUB_OUTPUT"
          echo "ref=$(read_automation ref)" >> "$GITHUB_OUTPUT"
          echo "path=$(read_automation path)" >> "$GITHUB_OUTPUT"

      - name: Check out the central automation code
        if: steps.cfg.outputs.repo != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ steps.cfg.outputs.repo }}
          ref: ${{ steps.cfg.outputs.ref }}
          path: central

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.cfg.outputs.repo != ''
        with:
          node-version: 22 # ≥22.18 runs the central TypeScript directly (type stripping)

      # Cache hit: put the cached binary on the PATH (the runner image already
      # carries libxml2, xmllint's only shared-library dependency beyond the
      # base system; the cache key ties the binary to one image). Cache miss:
      # reap the background install and keep its binary for the save step.
      # `ps -p` rather than `kill -0`: the installer runs under sudo, so a
      # signal from this unprivileged step would be refused while it still runs.
      - name: Set up xmllint (MEI machine-check)
        if: github.event_name == 'pull_request_target' && steps.cfg.outputs.repo != ''
        run: |
          if [ "${{ steps.xmllint-cache.outputs.cache-hit }}" = "true" ]; then
            sudo install -m 0755 /tmp/xmllint-bin/xmllint /usr/local/bin/xmllint
          else
            while ps -p "$(cat /tmp/xmllint-install.pid)" > /dev/null 2>&1; do sleep 0.2; done
            cat /tmp/xmllint-install.log
            mkdir -p /tmp/xmllint-bin
            cp "$(command -v xmllint)" /tmp/xmllint-bin/xmllint
          fi
          xmllint --version

      # Saved before the coordinator runs, so a rejected submission (a failing
      # run) still fills the cache. Skipped when the binary came from the cache.
      - name: Save the xmllint binary to the cache (MEI machine-check)
        if: github.event_name == 'pull_request_target' && steps.cfg.outputs.repo != '' && steps.xmllint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/xmllint-bin
          key: ${{ steps.xmllint-key.outputs.key }}

      - name: Run the central coordinator
        if: steps.cfg.outputs.repo != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Numeric account id is the identity written to the tracking tables;
          # the login rides alongside for human-readable commit messages only.
          PR_AUTHOR: ${{ github.event.pull_request.user.id }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node central/${{ steps.cfg.outputs.path }}
